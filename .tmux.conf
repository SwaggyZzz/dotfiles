# ╭──────────────────────────────────────────────────────────╮
# │                         Plugins                          │
# ╰──────────────────────────────────────────────────────────╯

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 首次启动时自动准备 TPM；之后每次加载配置都会补装缺失插件。
# install_plugins 对已安装插件只做本地检查，不会重复下载或更新。
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
if "test ! -x ~/.tmux/plugins/tpm/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
if "test -x ~/.tmux/plugins/tpm/bin/install_plugins" \
  "run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1'"

# ╭──────────────────────────────────────────────────────────╮
# │                          Theme                           │
# ╰──────────────────────────────────────────────────────────╯

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#{b:pane_current_path} #{?window_zoomed_flag,,󰹑}"
set -g @catppuccin_window_current_text "#{b:pane_current_path} #{?window_zoomed_flag,,󰹑}"

# 统一选中和非选中 window 的 rounded 分隔符，避免重复 source 后 current 样式残留。
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "all"

# Catppuccin v2 需要先加载主题，再显式拼接 status 模块，最后让 tmux-cpu
# 把 CPU 占位符替换成脚本调用。
run '~/.tmux/plugins/tmux/catppuccin.tmux'
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_session}"

run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'

# ╭──────────────────────────────────────────────────────────╮
# │                         Options                          │
# ╰──────────────────────────────────────────────────────────╯

set -g mouse on
set -g default-shell "/opt/homebrew/bin/fish"
set -g history-limit 1000000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g status-position bottom
set -g pane-border-lines heavy
set -g allow-passthrough on

set -s set-clipboard on
set -sg escape-time 0

set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi

# 真彩色和 kitty 支持。
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-features ",xterm-kitty:RGB"

# 让 yazi 等 TUI 工具在 tmux 内正确感知终端能力。
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ╭──────────────────────────────────────────────────────────╮
# │                       Keybindings                        │
# ╰──────────────────────────────────────────────────────────╯

# 分屏时沿用当前 pane 路径。
bind-key v split-window -h -l 100 -c '#{pane_current_path}'
bind-key s split-window -v -l 30 -c '#{pane_current_path}'

# 移动和整理窗口。
bind-key S-Left swap-window -t -1
bind-key S-Right swap-window -t +1
bind-key = select-layout even-horizontal
bind-key | select-layout even-vertical
bind-key x kill-pane
bind-key r source-file ~/.tmux.conf

# Vim 风格 pane 导航和调整大小。
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

bind-key J resize-pane -D 10
bind-key K resize-pane -U 10
bind-key H resize-pane -L 10
bind-key L resize-pane -R 10

# ╭──────────────────────────────────────────────────────────╮
# │                      Nvim navigator                      │
# ╰──────────────────────────────────────────────────────────╯

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
